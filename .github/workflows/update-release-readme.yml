name: Update release download in README

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-readme
  cancel-in-progress: false

jobs:
  update:
    name: Link the latest published stable package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install script dependencies
        run: npm ci --ignore-scripts
      - name: Update README on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-release-readme.mjs "$GITHUB_REPOSITORY"
